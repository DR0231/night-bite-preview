<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" role="img" aria-labelledby="t d">
  <title id="t">Floating / hover rig</title>
  <desc id="d">Slip-sinker base with foam float lifting bait off bottom</desc>
  <rect width="280" height="200" fill="none"/>
  <line x1="50" y1="18" x2="50" y2="65" stroke="#f5edd8" stroke-width="2.5"/>
  <ellipse cx="50" cy="76" rx="13" ry="9" fill="#c48420" stroke="#f5edd8" stroke-width="1.5"/>
  <text x="72" y="80" fill="#f5edd8" font-family="monospace" font-size="11">sinker</text>
  <circle cx="50" cy="92" r="4.5" fill="#ffe08a"/>
  <rect x="44" y="100" width="12" height="14" rx="2" fill="none" stroke="#f0a830" stroke-width="2"/>
  <line x1="50" y1="114" x2="50" y2="145" stroke="#f5edd8" stroke-width="2" stroke-dasharray="4 3"/>
  <!-- foam float -->
  <ellipse cx="50" cy="152" rx="10" ry="7" fill="#ffe08a" stroke="#f0a830" stroke-width="1.5"/>
  <text x="68" y="156" fill="#f0a830" font-family="monospace" font-size="11">foam float</text>
  <line x1="50" y1="159" x2="50" y2="172" stroke="#f5edd8" stroke-width="2"/>
  <path d="M50 172 L50 182 Q50 192 62 190" fill="none" stroke="#f0a830" stroke-width="2.5" stroke-linecap="round"/>
  <text x="72" y="192" fill="#f5edd8" font-family="monospace" font-size="11">bait off silt</text>
  <!-- bottom line -->
  <line x1="20" y1="188" x2="120" y2="188" stroke="#8a9aaa" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
  <text x="150" y="24" fill="#c48420" font-family="monospace" font-size="12">FLOATING / HOVER</text>
</svg>
