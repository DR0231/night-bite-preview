<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" role="img" aria-labelledby="t d">
  <title id="t">Three-way rig</title>
  <desc id="d">Three-way swivel with dropper to sinker and longer arm to bait</desc>
  <rect width="280" height="200" fill="none"/>
  <line x1="120" y1="18" x2="120" y2="70" stroke="#f5edd8" stroke-width="2.5"/>
  <text x="132" y="40" fill="#f5edd8" font-family="monospace" font-size="11">main</text>
  <!-- 3-way -->
  <circle cx="120" cy="82" r="10" fill="none" stroke="#f0a830" stroke-width="2.5"/>
  <line x1="114" y1="76" x2="126" y2="88" stroke="#f0a830" stroke-width="1.5"/>
  <line x1="126" y1="76" x2="114" y2="88" stroke="#f0a830" stroke-width="1.5"/>
  <text x="138" y="86" fill="#f0a830" font-family="monospace" font-size="11">3-way</text>
  <!-- dropper down -->
  <line x1="120" y1="92" x2="120" y2="150" stroke="#f5edd8" stroke-width="2"/>
  <polygon points="120,158 112,145 128,145" fill="#c48420" stroke="#f5edd8" stroke-width="1"/>
  <text x="132" y="152" fill="#f5edd8" font-family="monospace" font-size="11">sinker</text>
  <!-- bait arm -->
  <line x1="120" y1="82" x2="200" y2="130" stroke="#f5edd8" stroke-width="2" stroke-dasharray="4 3"/>
  <path d="M200 130 L210 140 Q218 148 208 152" fill="none" stroke="#f0a830" stroke-width="2.5" stroke-linecap="round"/>
  <text x="170" y="120" fill="#f0a830" font-family="monospace" font-size="11">bait arm</text>
  <text x="20" y="24" fill="#c48420" font-family="monospace" font-size="12">THREE-WAY</text>
</svg>
