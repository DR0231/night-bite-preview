<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" role="img" aria-labelledby="t d">
  <title id="t">Slip-float rig</title>
  <desc id="d">Stop, bead, slip float, shot, jig or minnow</desc>
  <rect width="280" height="200" fill="none"/>
  <line x1="80" y1="16" x2="80" y2="45" stroke="#f5edd8" stroke-width="2"/>
  <!-- stop -->
  <rect x="72" y="45" width="16" height="6" rx="1" fill="#f0a830"/>
  <text x="98" y="51" fill="#f0a830" font-family="monospace" font-size="11">stop</text>
  <circle cx="80" cy="60" r="4" fill="#ffe08a"/>
  <text x="98" y="64" fill="#f5edd8" font-family="monospace" font-size="11">bead</text>
  <!-- float -->
  <ellipse cx="80" cy="88" rx="9" ry="18" fill="#f0a830" stroke="#f5edd8" stroke-width="1.5"/>
  <line x1="80" y1="70" x2="80" y2="106" stroke="#1a1208" stroke-width="1.5"/>
  <text x="98" y="92" fill="#f0a830" font-family="monospace" font-size="11">slip float</text>
  <line x1="80" y1="106" x2="80" y2="145" stroke="#f5edd8" stroke-width="2"/>
  <!-- shot -->
  <circle cx="80" cy="150" r="5" fill="#8a9aaa" stroke="#f5edd8" stroke-width="1"/>
  <text x="98" y="154" fill="#f5edd8" font-family="monospace" font-size="11">shot</text>
  <line x1="80" y1="155" x2="80" y2="170" stroke="#f5edd8" stroke-width="2"/>
  <path d="M80 170 L80 180 Q88 188 96 182" fill="none" stroke="#f0a830" stroke-width="2.5"/>
  <text x="98" y="186" fill="#f0a830" font-family="monospace" font-size="11">jig / minnow</text>
  <text x="160" y="24" fill="#c48420" font-family="monospace" font-size="12">SLIP-FLOAT</text>
</svg>
