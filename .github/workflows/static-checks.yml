# Gate on every push and pull request to main: the static checks, then one
# browser check (check-live-readings: fake gauge answers, nothing real fetched)
# against tools/serve.py with the runner's Google Chrome. The other browser
# checks run from tools/check-all.py. tools/promote.py carries
# .github/workflows/ to the live repo; ISSUE_TEMPLATE stays skipped.
name: Static checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python tools
        run: python3 -m pip install --user beautifulsoup4 lxml pillow

      - name: Run static checks
        run: |
          set -euo pipefail
          python3 tools/check-meta.py
          python3 tools/check-radius.py
          python3 tools/check-hours.py
          python3 tools/check-ramp-names.py
          python3 tools/check-lake-isolation.py
          python3 tools/check-i18n.py
          python3 tools/check-manifest.py
          python3 tools/biting-split.py --check
          python3 tools/sw-precache.py --check
          python3 tools/build-tile-charts.py --check
          python3 tools/nav-labels.py --check
          python3 tools/footer-social.py --check
          python3 tools/glance_bake.py --check
          python3 tools/check-precache-refs.py

      - name: Install the browser check tools
        run: cd tools && npm install --no-audit --no-fund

      - name: Live readings never shown stale (browser)
        run: |
          set -euo pipefail
          python3 tools/serve.py --port 8642 &
          sleep 2
          node tools/check-live-readings.cjs http://127.0.0.1:8642/night-bite-preview/ /tmp/nb-live-readings
