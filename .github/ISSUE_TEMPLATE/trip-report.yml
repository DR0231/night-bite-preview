name: Trip report
description: Submit a trip at Hoover Reservoir, Alum Creek Lake, Buckeye Lake, O'Shaughnessy Reservoir, Griggs Reservoir, Indian Lake or Delaware Lake for the community log.
title: "Trip: "
labels: ["trip-report"]
body:
  - type: markdown
    attributes:
      value: |
        Public info only: no secret GPS, no private property, no personal addresses.
        Photos are Phase 2. Confirm you fished public access at Hoover Reservoir, Alum Creek Lake, Buckeye Lake, O'Shaughnessy Reservoir, Griggs Reservoir, Indian Lake or Delaware Lake (OH).
  - type: dropdown
    id: lake
    attributes:
      label: Lake
      options:
        - Hoover Reservoir
        - Alum Creek Lake
        - Buckeye Lake
        - O'Shaughnessy Reservoir
        - Griggs Reservoir
        - Indian Lake
        - Delaware Lake
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date
      placeholder: "YYYY-MM-DD"
    validations:
      required: true
  - type: dropdown
    id: species
    attributes:
      label: Species
      options:
        - Channel catfish
        - Blue catfish
        - Flathead catfish
        - Largemouth bass
        - Smallmouth bass
        - Black crappie
        - White crappie
        - Bluegill / sunfish
        - White bass
        - Hybrid striped bass
        - Saugeye
        - Walleye
        - Common carp
        - Longnose gar
        - Muskellunge
        - Yellow perch
        - Bullhead
        - Other
    validations:
      required: true
  - type: input
    id: ramp
    attributes:
      label: Ramp / area (public)
      description: Public names only (for example Oxbow at Hoover, Cheshire at Alum Creek, North Shore at Buckeye Lake, Glick Rd at O'Shaughnessy, or bank).
    validations:
      required: true
  - type: dropdown
    id: time_window
    attributes:
      label: Time window
      options:
        - Day
        - Night
        - Dawn / dusk
        - Mixed
    validations:
      required: true
  - type: input
    id: bait
    attributes:
      label: Bait / lure
    validations:
      required: true
  - type: dropdown
    id: keep_release
    attributes:
      label: Keep / release
      options:
        - Released
        - Kept (1)
        - Kept (2)
        - Kept (other)
        - No fish
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Public-safe notes only.
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirm
      options:
        - label: This was at the lake above on public access; no private property or secret pins.
          required: true
        - label: I understand regs must be verified on HuntFish OH / ODNR (this site is unofficial).
          required: true
